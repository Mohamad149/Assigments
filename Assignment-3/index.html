<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواعيد اللقاءات</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="container">
        <h1>مواعيد اللقاءات القادمة</h1>
        <p class="intro">تعرّف على اللقاءات القادمة ومواعيدها.</p>

        <div class="card first">
            <span class="badge">اللقاء الأول</span>
            <h2>أساسيات HTML</h2>
            <p class="description">تعرّف على أساسيات بناء صفحات الويب باستخدام HTML.</p>
            <p class="date">السبت 10:00 صباحا</p>
            <button type="button">تفاصيل اللقاء</button>
        </div>

        <div class="card second">
            <span class="badge">اللقاء الثاني</span>
            <h2>تنسيق الصفحات باستخدام CSS</h2>
            <p class="description">تعلّم كيفية تنسيق صفحات الويب والتحكم بالألوان والخطوط والمسافات.</p>
            <p class="date">الاثنين 5:00 مساء</p>
            <button type="button">تفاصيل اللقاء</button>
        </div>
    </main>
</body>

</html>
